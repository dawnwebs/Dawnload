# cargo-deny: keeps the dependency tree compatible with Dawnload's MIT license.
# Run: cargo deny check licenses   (CI does, in .github/workflows/rust.yml)

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    # Mozilla's root certificate list as data (webpki-root-certs).
    "CDLA-Permissive-2.0",
    # File-level copyleft; only option-ext (via directories). Its source is published, which is
    # all MPL asks of a binary that doesn't modify it. See docs/adr/0009-licensing.md.
    "MPL-2.0",
    # Slint's royalty-free license for desktop apps (attribution required). The Slint crates are
    # GPL-3.0 OR this OR commercial; Dawnload uses this one. See docs/adr/0009-licensing.md.
    "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "allow"

[advisories]
ignore = []
