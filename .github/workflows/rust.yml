name: Rust

on:
  push:
    branches: [main]
    paths: ["crates/**", ".cargo/**", "Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", ".cargo/**", "Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # x86-64 Linux and Windows, ARM Linux and Windows (free for public repos), and Apple
        # Silicon macOS. The ARM builds also run natively in VMs on Apple Silicon Macs.
        # Linux is pinned to Ubuntu 24.04, the oldest release we support: a binary built against
        # a newer glibc (ubuntu-latest is 26.04 now) won't start on older systems.
        os: [ubuntu-24.04, windows-latest, ubuntu-24.04-arm, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache keys by OS and CPU only ("Linux-x64"), so ubuntu-24.04 restored the old
          # ubuntu-latest (26.04) build and rustc couldn't load the cached slint crate. One cache
          # per runner image.
          key: ${{ matrix.os }}
      - name: Static C runtime on Windows
        # RUSTFLAGS replaces .cargo/config.toml's rustflags, so CI repeats +crt-static here.
        # Without it the .exe needs VCRUNTIME140.dll, which a clean Windows doesn't have.
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=$RUSTFLAGS -C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: Linux packages for Slint
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libudev-dev libdbus-1-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Build release binaries
        run: cargo build --release --locked -p dawnload-cli -p dawnload-ui
      - uses: actions/upload-artifact@v4
        with:
          name: dawnload-${{ matrix.os }}
          path: |
            target/release/dawnload
            target/release/dawnload.exe
            target/release/dawnload-app
            target/release/dawnload-app.exe
          if-no-files-found: error

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
