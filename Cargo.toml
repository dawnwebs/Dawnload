[workspace]
resolver = "3"
members = ["crates/dawnload-core", "crates/dawnload-cli", "crates/dawnload-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/brenoandrew/Dawnload"
rust-version = "1.89"

[workspace.dependencies]
dawnload-core = { path = "crates/dawnload-core" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
